<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Donut</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="card-track">
      <div class="card-wrapper">
        <div class="card">
          <div class="card-image"></div>
          <div class="card-gradient"></div>
          <div class="card-letters"></div>
        </div>
        <div class="card-corners">
          <span class="card-corner"></span>
          <span class="card-corner"></span>
          <span class="card-corner"></span>
          <span class="card-corner"></span>
        </div>
      </div>
    </div>
    <canvas class="center-canvas"></canvas>

    <aside class="controls">
      <h1>Controls</h1>

      <label class="control-row">
        <span>Rot X</span>
        <input type="range" id="rotX" min="0" max="1" step="0.01" value="0.5" />
        <output for="rotX">0.50</output>
      </label>

      <label class="control-row">
        <span>Rot Y</span>
        <input type="range" id="rotY" min="0" max="1" step="0.01" value="0" />
        <output for="rotY">0.00</output>
      </label>

      <label class="control-row">
        <span>Rot Z</span>
        <input type="range" id="rotZ" min="0" max="1" step="0.01" value="0.5" />
        <output for="rotZ">0.50</output>
      </label>

      <label class="control-row">
        <span>Font size</span>
        <input type="range" id="fontSize" min="1" max="30" step="1" value="13" />
        <output for="fontSize">13px</output>
      </label>

      <label class="control-row">
        <span>Major radius</span>
        <input type="range" id="major" min="10" max="60" step="1" value="35" />
        <output for="major">35%</output>
      </label>

      <label class="control-row">
        <span>Minor radius</span>
        <input type="range" id="minor" min="5" max="40" step="1" value="15" />
        <output for="minor">15%</output>
      </label>

      <label class="control-row">
        <span>Detail</span>
        <input
          type="range"
          id="detail"
          min="0.25"
          max="4"
          step="0.25"
          value="1"
        />
        <output for="detail">1.00x</output>
      </label>

      <label class="control-row">
        <span>Pixel size</span>
        <input
          type="range"
          id="pixelSize"
          min="1"
          max="16"
          step="1"
          value="4"
        />
        <output for="pixelSize">4</output>
      </label>
    </aside>

    <script type="module" src="./script.js"></script>
  </body>
</html>
